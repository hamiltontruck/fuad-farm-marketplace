name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint changed production modules
        run: |
          npx eslint \
            app/layout.tsx \
            app/saved/page.tsx \
            app/broker-dashboard/page.tsx \
            app/notifications/page.tsx \
            components/operations/AdminPanel.tsx \
            components/operations/BrokerDashboardPanel.tsx \
            components/operations/MarketplaceControlBar.tsx \
            components/operations/MyListingsPanel.tsx \
            components/operations/NotificationsPanel.tsx \
            components/operations/PublicListingsPanel.tsx \
            components/operations/SavedListingsPanel.tsx \
            lib/supabase-browser.ts
      - name: Build and validate artifact
        run: npm run build
      - name: Rendered HTML regression test
        run: node --test tests/rendered-html.test.mjs
